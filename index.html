<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#050812">
  <meta name="description" content="NexusCode — futuristic software, AI, cybersecurity and NexusOS experience.">
  <title>NexusCode | NexusOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-card">
      <div class="brand-mark">N</div>
      <div class="boot-title">NEXUS<span>CODE</span></div>
      <div id="boot-log" class="boot-log"></div>
      <div class="boot-progress"><div id="boot-progress-bar"></div></div>
    </div>
  </div>

  <div id="auth" class="auth-screen hidden">
    <div class="auth-grid"></div>
    <div class="auth-card glass">
      <div class="brand-mark large">N</div>
      <h1>NexusOS</h1>
      <p>Secure interactive workspace</p>
      <form id="auth-form">
        <label>Operator name<input id="auth-user" autocomplete="username" placeholder="Choose a username" maxlength="24" required></label>
        <label>Access code<input id="auth-pwd" type="password" autocomplete="current-password" placeholder="nexus" required></label>
        <button class="primary-btn" type="submit">ENTER NEXUSOS</button>
      </form>
      <small>Demo access code: <b>nexus</b></small>
      <div id="auth-error" class="error"></div>
    </div>
  </div>

  <main id="desktop" class="desktop hidden">
    <div id="wallpaper" class="wallpaper"></div>
    <div class="desktop-grid">
      <button class="desktop-icon" data-app="terminal"><span>⌁</span><b>Terminal</b></button>
      <button class="desktop-icon" data-app="files"><span>▣</span><b>Files</b></button>
      <button class="desktop-icon" data-app="browser"><span>◉</span><b>Browser</b></button>
      <button class="desktop-icon" data-app="monitor"><span>⌁</span><b>System</b></button>
      <button class="desktop-icon" data-app="security"><span>◇</span><b>Security</b></button>
      <button class="desktop-icon" data-app="chat"><span>◌</span><b>Comms</b></button>
      <button class="desktop-icon" data-app="ai"><span>✦</span><b>Nexus AI</b></button>
      <button class="desktop-icon" data-app="runner"><span>▶</span><b>Runner</b></button>
      <button class="desktop-icon" data-app="settings"><span>⚙</span><b>Settings</b></button>
      <button class="desktop-icon" data-app="company"><span>⌂</span><b>Company</b></button>
    </div>

    <div id="windows"></div>

    <div id="start-menu" class="start-menu glass hidden">
      <div class="start-head"><div class="brand-mini">N</div><div><b>NexusOS</b><small id="start-user">operator</small></div></div>
      <div class="start-search"><input id="app-search" placeholder="Search apps, commands..."></div>
      <div id="app-list" class="app-list"></div>
      <div class="start-foot"><button data-app="settings">Settings</button><button id="logout-btn">Log out</button></div>
    </div>

    <div id="toast-stack" class="toast-stack"></div>

    <footer class="taskbar">
      <button id="start-btn" class="start-btn"><span class="brand-mini">N</span></button>
      <div id="task-list" class="task-list"></div>
      <div class="task-spacer"></div>
      <div class="task-status"><span id="net-dot"></span><span id="net-label">ONLINE</span></div>
      <div id="sys-clock" class="clock"></div>
    </footer>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
